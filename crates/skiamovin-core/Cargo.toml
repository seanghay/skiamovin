[package]
name = "skiamovin-core"
version.workspace = true
edition.workspace = true

[features]
ganesh = ["skia-safe/ganesh"]
metal = ["ganesh", "skia-safe/metal", "dep:objc2", "dep:objc2-metal", "dep:objc2-io-surface", "dep:objc2-core-foundation"]
gl = ["ganesh", "skia-safe/gl"]
vulkan = ["ganesh", "skia-safe/vulkan"]

[dependencies]
skia-safe = { version = "0.157", features = ["svg", "textlayout", "webp"] }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "detailed_layout_info"] }
serde_json = "1"
# Pinned: the simulation must give the same result in every build, and Rapier changes between versions.
rapier2d = { version = "=0.36.1", features = ["enhanced-determinism"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true, features = ["objc2-io-surface"] }
objc2-io-surface = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
